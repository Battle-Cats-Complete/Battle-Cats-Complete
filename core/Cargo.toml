[package]
name = "core"
version.workspace = true
edition.workspace = true
license-file.workspace = true
authors.workspace = true
repository.workspace = true
publish = false

[dependencies]
nyanko = { workspace = true, features = ["pack", "graphics"] }
image = { version = "0.25.10", default-features = false, features = ["png", "ico", "rayon"] }
imageproc = { version = "0.27.0", default-features = false, features = ["rayon", "text"] }
ab_glyph = "0.2.32"
zip = { version = "8.6", default-features = false, features = ["deflate", "deflate64"] }
regex = "1.13"
rayon = "1.12"
serde = { version = "1.0.229", features = ["derive", "rc"] }
serde_json = "1.0.151"
md-5 = "0.10"
hex = "0.4.3"
reqwest = { version = "0.13.4", default-features = false, features = ["blocking", "rustls", "charset", "http2", "system-proxy"] }
webp-animation = "0.10.0"
gif = "0.14.2"
directories = "6.0"
indexmap = { version = "2.14", features = ["serde"] }
postcard = { version = "1.1.3", default-features = false, features = ["use-std"] }
rustc-hash = "2.1.3"
byteorder = "1.5.0"
sha2 = "0.10.9"
rsa = { version = "0.9.10", features = ["sha2", "pem"] }
base64 = "0.23.1"
rasn-pkix = "0.28.14"
rasn = "0.28.14"
open = "5.4.1"
resand = "0.3.0"
thiserror = "2.0.20"
tracing = "0.1.44"