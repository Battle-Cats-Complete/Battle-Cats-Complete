[package]
name = "gui"
version.workspace = true
edition.workspace = true
license-file.workspace = true
authors.workspace = true
repository.workspace = true
publish = false

[dependencies]
nyanko = { workspace = true }
core = { path = "../core" }
bytemuck = "1.25"
iced = {version = "0.14", features = ["wgpu", "canvas", "markdown", "image", "smol", "advanced"]}
image = { version = "0.25.10", default-features = false, features = ["png", "ico"] }
rfd = "0.17.2"
rayon = "1.12"
smol = "2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
self_update = { version = "0.44", default-features = false, features = ["reqwest", "rustls", "archive-zip", "compression-zip-deflate"] }
open = "5.4.1"
arboard = "3.6.1"
notify = "8.2.0"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
directories = "6.0"
rustc-hash = "2.1.3"
sha2 = "0.10.9"

[target.'cfg(windows)'.build-dependencies]
winres = "0.1.12"